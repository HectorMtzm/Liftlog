name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --tests '*WorkoutFlowTest*'

      - name: Build APK
        run: ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: liftlog-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish "latest" pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk liftlog.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest liftlog.apk --prerelease --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7}. Install liftlog.apk on your phone (allow installs from unknown sources)."
